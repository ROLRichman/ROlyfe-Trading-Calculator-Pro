name: Translator Integration Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  translator-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify translator coverage
        run: node --test tests/translator.test.mjs
