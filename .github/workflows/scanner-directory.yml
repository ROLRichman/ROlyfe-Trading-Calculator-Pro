name: Scanner Directory Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Calculator Pro Scanner Hub status
        run: node --test tests/scanner-directory.test.mjs
